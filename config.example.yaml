# ${VAR} references are expanded from the environment.
interval: 5m
log_level: info   # debug, info, warn, error

# Optional – defaults to ipify/icanhazip.
# ip_sources:
#   ipv4: [https://api.ipify.org]
#   ipv6: [https://api6.ipify.org]

providers:
  hetzner-main:
    # Hetzner Console → Project → Security → API tokens (Read & Write)
    type: hetzner
    settings:
      token: ${HETZNER_TOKEN}

records:
  - provider: hetzner-main
    zone: example.com
    name: home
    type: A
    ttl: 300
  - provider: hetzner-main
    zone: example.com
    name: home
    type: AAAA
  - provider: hetzner-main
    zone: example.com
    name: "@"   # zone apex
    type: A

# Optional: ping the public IPv4 to detect line outages / IP changes early.
# watch:
#   enabled: true
#   interval: 15s
#   failures: 2

# Health endpoint for `dingo -healthcheck` / Docker HEALTHCHECK (enabled by default).
# health:
#   listen: 127.0.0.1:9180
#   fail_after: 15m   # default 3x interval
